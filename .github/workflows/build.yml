name: Build Totolink X6000R Firmware (Fixed DTB & Auto Wi-Fi)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync \
            python3 python3-pip zstd file wget device-tree-compiler gcc-aarch64-linux-gnu

      - name: Download Image Builder
        run: |
          RELEASE_VER="25.12.6"
          wget https://downloads.openwrt.org/releases/${RELEASE_VER}/targets/mediatek/filogic/openwrt-imagebuilder-${RELEASE_VER}-mediatek-filogic.Linux-x86_64.tar.zst
          tar -xvf openwrt-imagebuilder-*.tar.*
          rm openwrt-imagebuilder-*.tar.*
          mv openwrt-imagebuilder-* imagebuilder

      - name: Inject Custom DTS directly into Target
        run: |
          find imagebuilder -iname "*totolink*x6000r*.dts" -exec cp totolink-x6000r.dts {} \;

      - name: Auto-Enable Wi-Fi via Init Service
        run: |
          mkdir -p imagebuilder/files/etc/init.d
          cat << 'EOF' > imagebuilder/files/etc/init.d/autowifi
          #!/bin/sh /etc/rc.common
          START=99

          boot() {
              if [ -f /etc/config/wireless ]; then
                  uci set wireless.radio0.disabled='0' 2>/dev/null || true
                  uci set wireless.radio1.disabled='0' 2>/dev/null || true
                  sed -i "s/option disabled '1'/option disabled '0'/g" /etc/config/wireless
                  sed -i 's/option disabled 1/option disabled 0/g' /etc/config/wireless
                  uci commit wireless
                  wifi reload
              fi
          }
          EOF
          chmod +x imagebuilder/files/etc/init.d/autowifi

          mkdir -p imagebuilder/files/etc/rc.d
          ln -s ../init.d/autowifi imagebuilder/files/etc/rc.d/S99autowifi

      - name: Build Image
        run: |
          cd imagebuilder
          make image PROFILE="totolink_x6000r" PACKAGES="luci kmod-leds-gpio" FILES="files"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: totolink-x6000r-firmware-final
          path: imagebuilder/bin/targets/mediatek/filogic/openwrt-*-totolink_x6000r-squashfs-sysupgrade.bin
          
