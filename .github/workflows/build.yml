name: Build Totolink X6000R (Compile from Source)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget device-tree-compiler

      - name: Clone OpenWrt Source
        run: |
          git clone -b main https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Custom DTS
        run: |
          # Mencari dan menimpa file DTS bawaan OpenWrt dengan file buatanmu secara permanen
          find openwrt/target/linux/mediatek/ -name "mt7981b-totolink-x6000r.dts" -exec cp totolink-x6000r.dts {} \;

      - name: Generate Config
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_totolink_x6000r=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_kmod-leds-gpio=y
          EOF
          make defconfig

      - name: Inject Auto Wi-Fi Script
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          cat << 'EOF' > openwrt/files/etc/uci-defaults/99-custom-wifi
          #!/bin/sh
          [ -f /etc/config/wireless ] || /sbin/wifi config
          if [ -f /etc/config/wireless ]; then
            uci set wireless.radio0.disabled='0'
            uci set wireless.radio1.disabled='0'
            uci commit wireless
            wifi reload
          fi
          exit 0
          EOF
          chmod +x openwrt/files/etc/uci-defaults/99-custom-wifi

      - name: Download Packages
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: totolink-x6000r-firmware-fullsource
          path: openwrt/bin/targets/mediatek/filogic/openwrt-*-totolink_x6000r-squashfs-sysupgrade.bin
